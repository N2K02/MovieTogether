name: Watch-party checks (no APK published)
on:
  push:
    branches: [feature/internet-watch-party]
  workflow_dispatch:

permissions:
  contents: read

env:
  N2K02_PACKAGES_TOKEN: ${{ secrets.N2K02_PACKAGES_TOKEN }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile and validate (no release)
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
