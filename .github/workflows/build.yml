name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 1.0"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  APP: MovieTogether
  N2K02_PACKAGES_TOKEN: ${{ secrets.N2K02_PACKAGES_TOKEN }}

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Configure APK build channel
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "BUILD_VARIANT=Debug" >> "$GITHUB_ENV"
            echo "APK_INPUT=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          else
            echo "BUILD_VARIANT=Release" >> "$GITHUB_ENV"
            echo "APK_INPUT=app/build/outputs/apk/release/app-release-unsigned.apk" >> "$GITHUB_ENV"
          fi

      - name: Test public version resolution
        run: bash .github/scripts/test-public-version.sh

      - name: Resolve version and release notes
        env:
          REQUESTED: ${{ github.event.inputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          local_last=$(git tag -l 'v[0-9]*' | sed -nE 's/^v([0-9]+[.][0-9])$/\1/p' | sort -V | tail -1 || true)
          # Read the complete app-specific public tag history, including build-N tags.
          public_last=$(bash .github/scripts/latest-public-version.sh movietogether)
          public_last="${public_last#v}"
          last=$(printf '%s\n%s\n' "$local_last" "$public_last" | sed '/^$/d' | sort -V | tail -1)

          if [ -n "$REQUESTED" ]; then
            echo "$REQUESTED" | grep -Eq '^[0-9]+\.[0-9]$' || { echo "::error::Version must look like 1.0"; exit 1; }
            ver="$REQUESTED"
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            ver="${last:-1.0}"
          elif [ -z "$last" ]; then
            ver="1.0"
          else
            n=$(( ${last%.*} * 10 + ${last#*.} + 1 ))
            ver="$(( n / 10 )).$(( n % 10 ))"
          fi

          # PR APKs may share the latest stable version with an experimental suffix.
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ -n "$last" ]; then
            max=$(printf '%s\n%s\n' "$last" "$ver" | sort -V | tail -1)
            if [ "$max" != "$ver" ] || [ "$last" = "$ver" ]; then
              echo "::error::Release $ver must advance past $last"; exit 1
            fi
          fi
          echo "VERSION=$ver" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "APK_NAME=$APP-PR-${{ github.event.pull_request.number }}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          else
            echo "APK_NAME=$APP-$ver" >> "$GITHUB_ENV"
          fi

          changes=$(git log --no-merges --pretty='- %s' -40)
          [ -n "$changes" ] || changes="- Rebuild, no code changes"
          {
            echo "## $APP $ver"
            echo "Version code: $((100000 + GITHUB_RUN_NUMBER))"
            echo
            echo "### What's new"
            echo "$changes"
            echo
            echo "### Install"
            echo "Download the signed APK below and install it on your phone."
          } > release-notes.md

      - name: Verify registered Firebase Android clients
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('app/google-services.json').read_text())
          assert data['project_info']['project_id'] == 'movietogether-45988'
          clients = {c['client_info']['android_client_info']['package_name']:
                     c['client_info']['mobilesdk_app_id'] for c in data['client']}
          assert 'com.movietogether.app' in clients
          # Both build variants use the same Android package ID and Firebase app registration.
          # The previously registered .experimental client may remain in the project but is not used.
          print('Firebase configuration validated for shared stable/experimental package ID')
          PY

      - name: Verify unit tests and Android lint
        run: gradle --no-daemon testDebugUnitTest lintDebug

      - name: Build and sign APK
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION_SUFFIX=""
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            VERSION_SUFFIX="-experimental.$GITHUB_RUN_NUMBER"
          fi
          gradle --no-daemon testDebugUnitTest assemble$BUILD_VARIANT \
            -PappVersion="$VERSION" \
            -PappVersionCode="$VERSION_CODE" \
            -PappVersionSuffix="$VERSION_SUFFIX"

          test -n "$SIGNING_PASSPHRASE" || {
            echo "::error title=Missing signing secret::Add SIGNING_PASSPHRASE to MovieTogether Actions secrets."
            exit 1
          }
          test -s signing/keys.tar.enc

          K="$RUNNER_TEMP/keys"
          mkdir -p "$K"
          chmod 700 "$K"
          trap 'rm -rf "$K"' EXIT
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -in signing/keys.tar.enc -pass env:SIGNING_PASSPHRASE | tar -xf - -C "$K"

          BT=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/* | sort -V | tail -1)
          export RP=$(cat "$K/release.pass") OP=android
          "$BT/apksigner" rotate --out "$K/lineage" \
            --old-signer --ks "$K/old.keystore" --ks-pass env:OP --ks-key-alias androiddebugkey --key-pass env:OP \
            --new-signer --ks "$K/release.p12" --ks-pass env:RP --ks-key-alias release --key-pass env:RP

          UNSIGNED="$APK_INPUT"
          test -s "$UNSIGNED"
          "$BT/apksigner" sign \
            --ks "$K/old.keystore" --ks-pass env:OP --ks-key-alias androiddebugkey --key-pass env:OP \
            --next-signer --ks "$K/release.p12" --ks-pass env:RP --ks-key-alias release --key-pass env:RP \
            --lineage "$K/lineage" --rotation-min-sdk-version 28 \
            --out "$APK_NAME.apk" "$UNSIGNED"
          "$BT/apksigner" verify --print-certs "$APK_NAME.apk" | grep -E "Signer.*(DN|SHA-1 digest|SHA-256 digest)"

      - name: Upload signed APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}.apk
          if-no-files-found: error

      - name: Publish signed APK to MovieTogether Releases
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            tag="experimental-pr-$PR_NUMBER-run-$GITHUB_RUN_NUMBER"
            title="MovieTogether experimental · PR #$PR_NUMBER · build #$GITHUB_RUN_NUMBER"
            target="$PR_HEAD_SHA"
            extra=(--prerelease --latest=false)
          else
            tag="v$VERSION"
            title="MovieTogether $VERSION"
            target="$GITHUB_SHA"
            extra=(--latest)
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            [ "$GITHUB_EVENT_NAME" = "pull_request" ] || { echo "::error::Stable tag $tag already exists"; exit 1; }
            gh release upload "$tag" "$APK_NAME.apk" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$APK_NAME.apk" --repo "$GITHUB_REPOSITORY" --target "$target" \
              --title "$title" --notes-file release-notes.md "${extra[@]}"
          fi

      - name: Check public distribution configuration
        id: distribution
        env:
          DIST_TOKEN: ${{ secrets.ANDROID_DISTRIBUTION_TOKEN }}
        run: |
          if [ -n "$DIST_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_DISTRIBUTION_TOKEN is missing; public update manifests cannot be published."
          fi

      - name: Publish stable or experimental APK to public distribution
        if: steps.distribution.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.ANDROID_DISTRIBUTION_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/publish-distribution.sh
