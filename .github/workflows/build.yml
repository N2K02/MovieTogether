name: Build APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'
      - name: Resolve version from existing releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          last=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' | sed -nE 's/^v([0-9]+[.][0-9])$/\1/p' | sort -V | tail -1 || true)
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            version="${last:-1.0}"
            suffix="-experimental.$GITHUB_RUN_NUMBER"
          elif [ -z "$last" ]; then
            version="1.0"
            suffix=""
          else
            n=$(( ${last%.*} * 10 + ${last#*.} + 1 ))
            version="$(( n / 10 )).$(( n % 10 ))"
            suffix=""
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "APP_SUFFIX=$suffix" >> "$GITHUB_ENV"
          echo "APP_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Verify and build
        run: |
          gradle --no-daemon testDebugUnitTest lintDebug
          gradle --no-daemon assembleDebug -PappVersion="$APP_VERSION" -PappVersionCode="$APP_CODE" -PappVersionSuffix="$APP_SUFFIX"
      - name: Upload experimental APK
        uses: actions/upload-artifact@v4
        with:
          name: MovieTogether-experimental-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish experimental APK to repository releases
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "experimental-pr-${{ github.event.pull_request.number }}-run-${{ github.run_number }}" app/build/outputs/apk/debug/app-debug.apk --repo "$GITHUB_REPOSITORY" --target "${{ github.event.pull_request.head.sha }}" --prerelease --latest=false --title "MovieTogether experimental #${{ github.run_number }}" --notes "Experimental debug-signed sample APK for PR #${{ github.event.pull_request.number }}."
