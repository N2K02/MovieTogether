name: Build APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'
      - name: Verify and build
        run: |
          gradle --no-daemon testDebugUnitTest lintDebug
          gradle --no-daemon assembleDebug -PappVersion=1.0 -PappVersionCode=${{ github.run_number }} -PappVersionSuffix=-experimental.${{ github.run_number }}
      - name: Upload experimental APK
        uses: actions/upload-artifact@v4
        with:
          name: MovieTogether-experimental-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish experimental APK to repository releases
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "experimental-pr-${{ github.event.pull_request.number }}-run-${{ github.run_number }}" app/build/outputs/apk/debug/app-debug.apk --repo "$GITHUB_REPOSITORY" --target "${{ github.event.pull_request.head.sha }}" --prerelease --latest=false --title "MovieTogether experimental #${{ github.run_number }}" --notes "Experimental debug-signed sample APK for PR #${{ github.event.pull_request.number }}."
